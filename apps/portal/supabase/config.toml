project_id = "father-empowering-portal"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_signup = false

# Disposable local-test limits. PostgreSQL buckets protect the BFF path as
# defense-in-depth; hosted Auth rate limits and CAPTCHA/edge remain mandatory
# because the publishable Supabase Auth endpoint is intentionally public.
[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 100
token_verifications = 100

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600
max_frequency = "1s"

[auth.email.template.magic_link]
subject = "Your Father Empowering verification code"
content_path = "./supabase/templates/magic-link-otp.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"
